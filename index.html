body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}

main{max-width:820px}

pre{background:var(--code);padding:.8rem;border-radius:6px;overflow-x:auto}pre code{padding:0}

}
async function entrar(senha, lembrar){
  PAGINAS = await abrir(senha);
  if (lembrar) { try { sessionStorage.setItem('wiki-senha', senha); } catch(e){} }
  document.getElementById('entrar').style.display = 'none';
  document.getElementById('wiki').style.display = 'block';
  mostrar();
}
document.getElementById('entrar').addEventListener('submit', async ev => {
  ev.preventDefault();
  document.getElementById('erro').textContent = 'Abrindo…';
  try { await entrar(document.getElementById('senha').value, true); }
  catch(e){ document.getElementById('erro').textContent = 'Senha incorreta.'; }
});
document.getElementById('sair').addEventListener('click', ev => {
  ev.preventDefault(); try { sessionStorage.removeItem('wiki-senha'); } catch(e){} location.hash=''; location.reload();
});
window.addEventListener('hashchange', () => PAGINAS && mostrar());
(async () => { let s=null; try { s = sessionStorage.getItem('wiki-senha'); } catch(e){}
  if (s) { try { await entrar(s, false); } catch(e){} } })();
</script></body></html>
